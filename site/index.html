<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PoorMad — terminal</title>
<meta name="description" content="PoorMad is a self-improving AI agent. Explore it from a terminal — type help, about, vision, download, or portal." />
<link rel="icon" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#050507; --surface:rgba(13,13,20,.72); --surface-2:rgba(18,18,28,.9);
  --line:rgba(139,92,246,.28); --line-soft:rgba(255,255,255,.08);
  --violet:#8b5cf6; --violet-bright:#a78bfa; --violet-dim:rgba(139,92,246,.5);
  --fg:#e9e6f5; --muted:#9b95ad; --muted-2:#6f6a80;
  --ok:#28c840; --warn:#febc2e; --err:#ff5f57; --cyan:#5fd7ff;
  --accent:var(--violet);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:rgba(139,92,246,.35);color:#fff}
a{color:var(--violet-bright);text-decoration:none}
a:hover{text-decoration:underline}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.crt{position:fixed;inset:0;z-index:1;pointer-events:none;mix-blend-mode:overlay;opacity:.45;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px)}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 0%,transparent 50%,rgba(0,0,0,.6) 100%)}

.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:22px}
.terminal{width:min(940px,100%);height:min(78vh,720px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 0 70px rgba(139,92,246,.14),0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line-soft);
  background:var(--surface-2);flex-shrink:0}
.bar i{width:11px;height:11px;border-radius:50%}
.bar .r{background:var(--err)}.bar .y{background:var(--warn)}.bar .g{background:var(--ok)}
.bar .title{margin-left:12px;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.bar .title b{color:var(--fg);font-weight:500}

.out{flex:1;overflow-y:auto;padding:18px 20px;font-size:14px;scroll-behavior:smooth}
.out::-webkit-scrollbar{width:9px}.out::-webkit-scrollbar-thumb{background:rgba(139,92,246,.35);border-radius:9px}
.line{white-space:pre-wrap;word-break:break-word;margin:2px 0}
.prompt{color:var(--accent)}
.prompt .u{color:var(--violet-bright)}
.prompt .p{color:var(--muted)}
.cmd-echo{color:var(--fg)}
.muted{color:var(--muted)}.dim{color:var(--muted-2)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.err{color:var(--err)}.cy{color:var(--cyan)}.vi{color:var(--violet-bright)}
.hl{color:var(--violet-bright)}
.ascii{color:var(--accent);font-size:12px;line-height:1.15;text-shadow:0 0 14px var(--violet-dim)}
.stat{display:flex;gap:10px}.stat .k{color:var(--muted);width:120px;flex-shrink:0}
.stat .v{color:var(--fg)}
a.cmd{color:var(--violet-bright);border-bottom:1px solid var(--violet-dim)}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line-soft);
  background:var(--surface-2);flex-shrink:0}
.chip{font-family:var(--mono);font-size:12.5px;color:var(--muted);border:1px solid var(--line-soft);
  background:rgba(139,92,246,.06);border-radius:999px;padding:7px 13px;cursor:pointer;
  transition:color .2s,border-color .2s,box-shadow .2s,transform .12s;user-select:none}
.chip:hover{color:var(--violet-bright);border-color:var(--violet-dim);box-shadow:0 0 14px rgba(139,92,246,.22)}
.chip:active{transform:scale(.96)}

.inputrow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line-soft);
  background:var(--surface-2);flex-shrink:0}
.inputrow .prompt{white-space:nowrap;font-size:14px}
#cmd{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:var(--mono);
  font-size:14px;caret-color:var(--accent)}
.cursor{position:fixed;top:0;left:0;z-index:70;pointer-events:none;width:30px;height:30px;margin:-15px 0 0 -15px;
  border:1px solid rgba(167,139,250,.6);border-radius:50%;mix-blend-mode:screen;transition:width .2s,height .2s,margin .2s,background .2s,opacity .3s}
.cursor.hover{width:48px;height:48px;margin:-24px 0 0 -24px;background:rgba(139,92,246,.1);border-color:rgba(167,139,250,.9)}
@media(hover:none),(pointer:coarse){.cursor{display:none}}
.sound{position:fixed;bottom:18px;right:18px;z-index:80;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:rgba(13,13,20,.7);backdrop-filter:blur(8px);cursor:pointer;
  display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:15px;transition:.2s}
.sound:hover{color:var(--fg);border-color:var(--violet)}
.sound.on{color:var(--violet-bright);border-color:var(--violet);box-shadow:0 0 16px rgba(139,92,246,.4)}
.progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:90;
  background:linear-gradient(90deg,var(--violet),var(--violet-bright));box-shadow:0 0 12px var(--violet)}
.boot{color:var(--muted);font-size:13.5px}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media(max-width:620px){.out{font-size:13px}.terminal{height:84vh}}
@media(prefers-reduced-motion:reduce){.cursor{display:none}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="crt"></div>
<div class="vignette"></div>
<div class="progress" id="progress"></div>
<div class="cursor" id="cursor"></div>
<button class="sound" id="sound" aria-label="Toggle sound" title="Sound: off">♪</button>

<div class="stage">
  <div class="terminal" id="term">
    <div class="bar">
      <i class="r"></i><i class="y"></i><i class="g"></i>
      <span class="title"><b>poormad</b> — bash — 80×24</span>
    </div>
    <div class="out" id="out"></div>
    <div class="chips" id="chips">
      <span class="chip" data-c="help">help</span>
      <span class="chip" data-c="about">about</span>
      <span class="chip" data-c="vision">vision</span>
      <span class="chip" data-c="mission">mission</span>
      <span class="chip" data-c="download">download</span>
      <span class="chip" data-c="portal">portal</span>
      <span class="chip" data-c="skills">skills</span>
      <span class="chip" data-c="neofetch">neofetch</span>
      <span class="chip" data-c="banner">banner</span>
      <span class="chip" data-c="clear">clear</span>
    </div>
    <div class="inputrow">
      <span class="prompt"><span class="u">visitor@poormad</span><span class="p">:~$</span></span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal command" placeholder="type a command — try 'help'" />
    </div>
  </div>
</div>

<script>
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var out=document.getElementById('out'),cmd=document.getElementById('cmd');

  /* ---------- output helpers ---------- */
  function line(html,cls){var d=document.createElement('div');d.className='line'+(cls?' '+cls:'');
    d.innerHTML=html;out.appendChild(d);out.scrollTop=out.scrollHeight;return d;}
  function blank(){line('&nbsp;');}
  function echo(cmdStr){line('<span class="prompt"><span class="u">visitor@poormad</span><span class="p">:~$</span></span> <span class="cmd-echo">'+esc(cmdStr)+'</span>');}
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function link(u,t){return '<a class="cmd" href="'+u+'" target="_blank" rel="noopener">'+esc(t||u)+'</a>';}

  /* ---------- OS detect for download ---------- */
  var UA=navigator.userAgent;
  var DL={win:'https://github.com/Tayyaba22/poormad-agent/releases/download/v0.18.0/PoorMad-0.18.0-win-x64.exe',
          mac:'https://github.com/Tayyaba22/poormad-agent/releases/download/v0.18.0/PoorMad-0.18.0-mac-arm64.dmg',
          tag:'https://github.com/Tayyaba22/poormad-agent/releases/tag/v0.18.0'};
  function dlURL(){if(/Mac|iPhone|iPad/i.test(UA))return DL.mac;if(/Win/i.test(UA))return DL.win;return DL.tag;}
  function dlLabel(){if(/Mac|iPhone|iPad/i.test(UA))return 'macOS (.dmg)';if(/Win/i.test(UA))return 'Windows (.exe)';return 'Linux';}

  /* ---------- ASCII art ---------- */
  var BANNER=
"  ____   ___  ___  _   _ ___ ___  _   ___     ___    ___ \n"+
" |  _ \\ / _ \\/ _ \\| \\ | |_ _/ _ \\| | | \\ \\   / / |  | __|\n"+
" | |_) | | | | | | |\\| || | | | | | |  \\ \\ / /| |  | _| \n"+
" |  __/| |_| | |_| | |\\  || | |_| | |_|   \\ V / | |__| |  \n"+
" |_|    \\___/ \\___/|_| \\_|___\\___/|___/     \\_/  |____|_|  ";
  var MOON=
"        _.--\"\"--._\n"+
"     .-'          '-.\n"+
"   .'   _        _    '.\n"+
"  /   / \\      / \\     \\\n"+
" |   |   |    |   |    |\n"+
" |    \\ _/    \\_ /     |\n"+
"  \\    '.      .'    /\n"+
"   '.   '--__--'   .'\n"+
"     '-.________.-'";

  /* ---------- commands ---------- */
  var CMDS={
    help:function(){
      line('Available commands:','muted');
      var rows=[['help','this list'],['about','what PoorMad is'],['vision','why it exists'],
        ['mission','what we\'re building'],['cause','sovereignty & open source'],
        ['research','the learning loop'],['skills','capability list'],
        ['download','get the installer ('+dlLabel()+')'],['portal','open the web portal'],
        ['whoami','who are you here'],['neofetch','system & project info'],
        ['banner','show the wordmark'],['theme','cycle accent color'],
        ['sudo','attempt privileged operation'],['clear','clear the screen']];
      rows.forEach(function(r){line('  <span class="hl">'+r[0].padEnd(10)+'</span><span class="dim">'+r[1]+'</span>');});
      blank();
      line('Tip: use ↑/↓ for history, Tab to complete, or tap a chip above.','dim');
    },
    about:function(){
      line('PoorMad is a <span class="vi">self-improving AI agent</span> built by one person, from a single room.');
      line('It writes its own skills, remembers who you are across sessions, and gets sharper the longer you keep it.');
      line('Not a service. Not a black box. <span class="vi">Yours.</span>');
      blank();
      line('When the light is blocked, the stars align.','vi');
    },
    vision:function(){
      line('<span class="vi">01 — VISION</span>');
      line('An intelligence that belongs to you.');
      blank();
      line('Most AI is rented — you type into someone else\'s machine, memory, and rules.');
      line('PoorMad is the opposite: an agent that lives on your side of the wall,');
      line('learning, remembering, and improving on your terms.');
    },
    mission:function(){
      line('<span class="vi">02 — MISSION</span>');
      line('Ship a real agent. From a laptop to a fleet.');
      blank();
      line('Started as one person, one room, one laptop — and a refusal to accept that');
      line('capable AI had to be closed, centralized, and extractive.');
      line('Install it, point it at a model, and it begins to learn.');
    },
    cause:function(){
      line('<span class="vi">03 — CAUSE</span>');
      line('Sovereignty over your own intelligence.');
      blank();
      line('Privacy by default. Local-first. Open source (MIT).');
      line('Built to be unique and yours only — no training on you, no locked memory,');
      line('no one sitting between you and your own agent.');
    },
    research:function(){
      line('<span class="vi">04 — RESEARCH</span>');
      line('The learning loop: how does an agent get permanently better from use,');
      line('without a central model swallowing everyone\'s data?');
      blank();
      line('  <span class="hl">skills</span>     experience → reusable, sharpened skills');
      line('  <span class="hl">memory</span>     semantic recall across sessions');
      line('  <span class="hl">orchestration</span> tools, subagents, scheduled jobs');
      line('  <span class="hl">surfaces</span>  one brain: CLI, desktop, web, 20+ messengers');
    },
    skills:function(){
      line('Current capability surface:','muted');
      ['self-improvement via skills','cross-session memory','tool & subagent orchestration',
       'scheduled/cron jobs','20+ messaging platforms','desktop + CLI + web portal',
       'model-agnostic (bring your own key)','local-first, private by default'].forEach(function(s){
        line('  <span class="ok">✓</span> '+s);});
    },
    download:function(){
      line('Downloading for <span class="vi">'+dlLabel()+'</span> — '+link(dlURL(),dlURL().split('/').pop()));
      line('All releases: '+link('https://github.com/Tayyaba22/poormad-agent/releases','github.com/.../releases'),'dim');
    },
    portal:function(){
      line('The Portal is where PoorMad meets you in the browser.');
      line('Accounts, billing, and hosting live there (coming on the Oracle VPS).');
      blank();
      line('→ '+link('https://portal.xingabot.com','portal.xingabot.com'));
    },
    whoami:function(){
      line('visitor — a curious human exploring PoorMad from a terminal.');
      line('No account required to look around. Type <span class="hl">download</span> to take it with you.','dim');
    },
    neofetch:function(){
      line('<span class="ascii">'+MOON+'</span>');
      line('<span class="vi">poormad</span>@xingabot');
      line('─────────────────');
      line('<span class="stat"><span class="k">project</span><span class="v">PoorMad — self-improving agent</span></span>');
      line('<span class="stat"><span class="k">built by</span><span class="v">1 person, 1 room, 1 laptop</span></span>');
      line('<span class="stat"><span class="k">license</span><span class="v">MIT (open source)</span></span>');
      line('<span class="stat"><span class="k">platforms</span><span class="v">20+ (CLI, desktop, web, messengers)</span></span>');
      line('<span class="stat"><span class="k">memory</span><span class="v">persistent, local-first</span></span>');
      line('<span class="stat"><span class="k">uptime</span><span class="v">since you opened this tab</span></span>');
      line('<span class="stat"><span class="k">mood</span><span class="v vi">when the light is blocked, the stars align</span></span>');
    },
    banner:function(){line('<span class="ascii">'+BANNER+'</span>');},
    theme:function(){
      var accents=[['#8b5cf6','violet'],['#5fd7ff','cyan'],['#febc2e','amber'],['#28c840','green'],['#ff6ad5','pink']];
      themeI=(themeI+1)%accents.length;var a=accents[themeI];
      document.documentElement.style.setProperty('--accent',a[0]);
      document.documentElement.style.setProperty('--violet',a[0]);
      line('accent set to <span class="vi">'+a[1]+'</span> '+a[0]);
    },
    sudo:function(){
      line('visitor is not in the sudoers file. This incident will be reported.','err');
      line('(just kidding — PoorMad is yours. try <span class="hl">whoami</span> or <span class="hl">download</span>)','dim');
    },
    clear:function(){out.innerHTML='';},
    ls:function(){line('about  vision  mission  cause  research  skills  download  portal  portal.xingabot.com');},
    cat:function(a){if(a&&a[0]==='README'){CMDS.about();}else line('cat: '+esc(a?a[0]:'')+': No such file','err');},
    echo:function(a){line(esc(a?a.join(' '):''));},
    exit:function(){line('there is no escape from a self-improving agent. (try <span class="hl">clear</span>)','dim');}
  };
  var themeI=0;
  var ALIAS={v:'vision',m:'mission',c:'cause',r:'research',d:'download',p:'portal',a:'about',h:'help','?':'help'};

  function run(raw){
    var s=raw.trim();if(!s)return;echo(s);
    var parts=s.split(/\s+/),name=parts[0].toLowerCase(),args=parts.slice(1);
    if(ALIAS[name])name=ALIAS[name];
    if(CMDS[name]){CMDS[name](args);}
    else{line('poormad: command not found: '+esc(parts[0]),'err');line('type <span class="hl">help</span> for a list of commands.','dim');}
  }

  /* ---------- history + tab complete ---------- */
  var hist=[],hi=-1;
  cmd.addEventListener('keydown',function(e){
    if(e.key==='Enter'){var v=cmd.value;if(v.trim()){hist.push(v);hi=hist.length;}
      run(v);cmd.value='';}
    else if(e.key==='ArrowUp'){if(hi>0){hi--;cmd.value=hist[hi]||'';}e.preventDefault();}
    else if(e.key==='ArrowDown'){if(hi<hist.length-1){hi++;cmd.value=hist[hi]||'';}else{hi=hist.length;cmd.value='';}e.preventDefault();}
    else if(e.key==='Tab'){e.preventDefault();var p=cmd.value.trim().toLowerCase();
      var m=Object.keys(CMDS).concat(Object.keys(ALIAS)).filter(function(k){return k.indexOf(p)===0;});
      if(m.length===1)cmd.value=m[0]+' ';}
  });

  /* ---------- chips ---------- */
  document.getElementById('chips').addEventListener('click',function(e){
    var c=e.target.closest('.chip');if(!c)return;var v=c.dataset.c;run(v);cmd.focus();});

  /* ---------- boot sequence (typed) ---------- */
  var BOOT=[
    ['booting poormad shell v0.18.0 ...','muted'],
    ['loading memory store ............ <span class="ok">ok</span>','muted'],
    ['mounting skills registry ........ <span class="ok">ok</span>','muted'],
    ['connecting gateway (local) ...... <span class="ok">ok</span>','muted'],
    ['',''],
    ['<span class="vi">Welcome to PoorMad.</span> This page is a terminal — type <span class="hl">help</span> to begin.',''],
    ['<span class="dim">when the light is blocked, the stars align</span>','']
  ];
  function boot(i){
    if(i>=BOOT.length){cmd.focus();return;}
    var b=BOOT[i];var d=line('<span class="boot">'+b[0]+'</span>',b[1]);
    if(b[0].indexOf('ok')>=0){} // already colored
    setTimeout(function(){boot(i+1);},reduce?0:260);
  }

  /* ---------- starfield (cosmic backdrop) ---------- */
  var cv=document.getElementById('stars'),cx=cv.getContext('2d'),stars=[],w,h,sy=0,mouse={x:-999,y:-999};
  function size(){w=cv.width=innerWidth;h=cv.height=innerHeight;}
  size();addEventListener('resize',size);
  var N=reduce?0:Math.min(150,Math.floor(innerWidth/9));
  for(var i=0;i<N;i++)stars.push({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.6+.4,
    r:Math.random()*1.4+.3,t:Math.random()*6.28,s:Math.random()*.012+.003});
  addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
  addEventListener('scroll',function(){sy=window.scrollY||0;},{passive:true});
  function draw(){
    cx.clearRect(0,0,w,h);
    var g=cx.createRadialGradient(w*0.78,h*0.12-sy*0.03,0,w*0.78,h*0.12-sy*0.03,h*0.7);
    g.addColorStop(0,'rgba(139,92,246,0.10)');g.addColorStop(1,'rgba(139,92,246,0)');
    cx.fillStyle=g;cx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){var st=stars[i];st.t+=st.s;st.y+=st.z*0.1;if(st.y>h){st.y=0;st.x=Math.random()*w;}
      var py=(st.y-sy*(0.02+st.z*0.05))%h;if(py<0)py+=h;
      var dx=st.x-mouse.x,dy=st.y-mouse.y,dd=Math.sqrt(dx*dx+dy*dy);
      var px=st.x+Math.sin(st.t)*Math.min(12,dd/40);
      cx.beginPath();cx.arc(px,py,st.r,0,7);cx.fillStyle='rgba(200,190,255,'+(0.4+Math.sin(st.t*2)*0.3)+')';cx.fill();}
    requestAnimationFrame(draw);
  }
  if(!reduce)draw();

  /* ---------- custom cursor + sound (reuse) ---------- */
  var cur=document.getElementById('cursor'),cx2=innerWidth/2,cy2=innerHeight/2,tx=cx2,ty=cy2;
  if(cur&&!reduce&&matchMedia('(hover:hover)').matches){
    addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY;
      cur.classList.toggle('hover',!!e.target.closest('a,.chip,input,button'));});
    (function lp(){cx2+=(tx-cx2)*.2;cy2+=(ty-cy2)*.2;cur.style.transform='translate('+cx2+'px,'+cy2+'px)';requestAnimationFrame(lp);})();
  }
  var prog=document.getElementById('progress');
  addEventListener('scroll',function(){if(!prog)return;var d=document.documentElement;
    prog.style.width=((d.scrollTop/(d.scrollHeight-d.clientHeight||1))*100)+'%';});
  var actx=null,sb=document.getElementById('sound'),son=false;
  function ctx(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();}
  function blip(f,d,v){if(!son||!actx)return;var o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);var t=actx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.1));o.start(t);o.stop(t+(d||.1)+.02);}
  if(sb){sb.addEventListener('click',function(){son=!son;ctx();sb.classList.toggle('on',son);sb.textContent=son?'♫':'♪';sb.title='Sound: '+(son?'on':'off');if(son)blip(660,.18,.08);});
    document.addEventListener('click',function(e){if(e.target.closest('a,.chip,button'))blip(520+Math.random()*120,.1,.04);});}

  /* ---------- go ---------- */
  boot(0);
})();
</script>
</body>
</html>
