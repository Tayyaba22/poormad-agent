# PoorMad-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: asana
description: >-
  Tasks, projects, and goals from your Asana workspace.
source: https://developers.asana.com/docs/using-asanas-mcp-server

# Official vendor-hosted remote MCP (URL-only — PoorMad never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration;
# PoorMad's MCP client + mcp_oauth_manager handle discovery, PKCE, token
# exchange, and refresh.
transport:
  type: http
  url: https://mcp.asana.com/sse

auth:
  type: oauth

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - asana
  hosts:
    - asana.com

post_install: |
  On first connection PoorMad opens a browser to authorize with
  Asana (or run `poormad mcp login asana`). Approve access,
  then restart the session so tools load.
