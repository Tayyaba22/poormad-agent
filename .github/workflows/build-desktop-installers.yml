name: Build Desktop Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for artifact names (default: package.json version)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            bundles: dmg zip
            artifact_glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: windows-latest
            target: win
            bundles: nsis msi
            artifact_glob: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.msi

    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # electron-builder postinstall for the native deps is handled by npm ci;
      # ensure the electron binary itself is fetched if postinstall was skipped.
      - name: Ensure electron binary
        run: node node_modules/electron/install.js
        working-directory: apps/desktop

      - name: Build renderer + main bundle
        run: npm run build
        working-directory: apps/desktop

      - name: Package ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run builder -- --${{ matrix.target }} ${{ matrix.bundles }} --publish never
        working-directory: apps/desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poormad-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14
